<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinal Maps - Recorrido Configurado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/basicos.css">
</head>
<body>

    <div id="map-wrap">
        
        <div id="header-mapa">
            <h1><i class="bi bi-geo-alt-fill text-primary"></i> Kinal Maps</h1>
            <p>Recorrido Técnico de Pasillos y Aulas</p>
        </div>
        
        <img id="lienzo-imagen" src="Basicos/pasillos/Entrada_Basicos.png" class="imagen-entorno-fullscreen" alt="Vista Kinal">

        <div class="capa-interactiva">
            
            <div data-nodo="1" class="hotspot activo" style="top: 50%; left: 50%;">
                <button onclick="cambiarNodo(2)" class="btn-flecha-maps" title="Subir"><i class="bi bi-arrow-up"></i> Subir a Coordinación Nivel 2</button>
            </div>


            <div data-nodo="2" class="hotspot" style="top: 55%; left: 30%;">
                <button onclick="cambiarNodo(3)" class="btn-flecha-maps" title="Ir a Química"><i class="bi bi-arrow-left"></i> Salones Química</button>
            </div>
            <div data-nodo="2" class="hotspot" style="top: 45%; left: 50%;">
                <button onclick="cambiarNodo(4)" class="btn-flecha-maps" title="Ir al Pasillo"><i class="bi bi-arrow-up"></i> Pasillo 1 Segundo Nivel</button>
            </div>
            <div data-nodo="2" class="hotspot" style="top: 55%; left: 70%;">
                <button onclick="cambiarNodo(7)" class="btn-flecha-maps" title="Ir a Acceso Coordinación"><i class="bi bi-arrow-right"></i> Pasillo Coordinación</button>
            </div>
            <div data-nodo="2" class="hotspot" style="top: 85%; left: 50%;">
                <button onclick="cambiarNodo(1)" class="btn-flecha-maps" title="Bajar"><i class="bi bi-arrow-down"></i> Bajar a la Entrada</button>
            </div>


            <div data-nodo="3" class="hotspot" style="top: 50%; left: 50%;">
                <button onclick="abrirPanelFlotante('Laboratorio de Química', 'CIENCIAS', 'Área de laboratorios científicos del segundo nivel.')" class="btn-marcador-info"><i class="bi bi-info-circle"></i> Info Laboratorio</button>
            </div>
            <div data-nodo="3" class="hotspot" style="top: 85%; left: 50%;">
                <button onclick="cambiarNodo(2)" class="btn-flecha-maps" title="Regresar"><i class="bi bi-arrow-down"></i> Volver al Distribuidor</button>
            </div>


            <div data-nodo="4" class="hotspot" style="top: 50%; left: 50%;">
                <button onclick="cambiarNodo(5)" class="btn-flecha-maps" title="Avanzar"><i class="bi bi-arrow-up"></i> Pasillo Salón Indus</button>
            </div>
            <div data-nodo="4" class="hotspot" style="top: 85%; left: 50%;">
                <button onclick="cambiarNodo(2)" class="btn-flecha-maps" title="Regresar"><i class="bi bi-arrow-down"></i> Volver al Distribuidor</button>
            </div>


            <div data-nodo="5" class="hotspot" style="top: 50%; left: 50%;">
                <button onclick="cambiarNodo(6)" class="btn-flecha-maps" title="Avanzar"><i class="bi bi-arrow-up"></i> Pasillo Salones 2do Nivel</button>
            </div>
            <div data-nodo="5" class="hotspot" style="top: 85%; left: 50%;">
                <button onclick="cambiarNodo(4)" class="btn-flecha-maps" title="Regresar"><i class="bi bi-arrow-down"></i> Atrás</button>
            </div>


            <div data-nodo="6" class="hotspot" style="top: 85%; left: 50%;">
                <button onclick="cambiarNodo(5)" class="btn-flecha-maps" title="Regresar"><i class="bi bi-arrow-down"></i> Volver a Salón Indus</button>
            </div>


            <div data-nodo="7" class="hotspot" style="top: 50%; left: 50%;">
                <button onclick="cambiarNodo(8)" class="btn-flecha-maps" title="Avanzar"><i class="bi bi-arrow-up"></i> Ver Coordinación</button>
            </div>
            <div data-nodo="7" class="hotspot" style="top: 85%; left: 50%;">
                <button onclick="cambiarNodo(2)" class="btn-flecha-maps" title="Regresar"><i class="bi bi-arrow-down"></i> Volver al Distribuidor</button>
            </div>


            <div data-nodo="8" class="hotspot" style="top: 50%; left: 50%;">
                <button onclick="abrirPanelFlotante('Oficina de Coordinación', 'ADMINISTRACIÓN', 'Centro de atención académica y de profesores.')" class="btn-marcador-info"><i class="bi bi-door-closed"></i> Ver Detalles</button>
            </div>
            <div data-nodo="8" class="hotspot" style="top: 85%; left: 50%;">
                <button onclick="cambiarNodo(7)" class="btn-flecha-maps" title="Regresar"><i class="bi bi-arrow-down"></i> Paso Atrás</button>
            </div>

        </div>

        <div id="entry-panel">
            <div id="ep-txt-titulo" class="ep-title fw-bold text-dark fs-5">Lugar</div>
            <div id="ep-txt-badge" class="badge bg-primary my-1">Categoría</div>
            <div id="ep-txt-descripcion" class="ep-desc text-muted mt-2 small">Descripción.</div>
            <button id="entry-go-btn" class="btn btn-dark btn-sm w-100 mt-3" onclick="cerrarPanelFlotante()">CERRAR PANEL</button>
        </div>

        <div id="indicador-entorno">Entorno Actual: <span id="nombre-lugar-actual" class="text-primary fw-bold">Entrada de Básicos</span></div>

    </div>

    <script src="js/pasillosBasicos.js"></script>
</body>
</html>
